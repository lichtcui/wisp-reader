<?xml version="1.0" encoding="utf-8"?>
<!-- 阅读页顶栏「换源」（日间）。形状来自需求给定的 SVG，ArkUI 适配：
     1) 去掉 <defs><style> 与 class，把 .cls-1 的样式内联（SVG 类选择器不保证被解析）；
     2) 尺寸规范：24vp 画板内墨迹框统一为 20vp 宽、居中留白 2vp，与项目既有的
        refresh_ccw.svg（20vp 主体）及右侧刷新图标一致；横向图标高度按固有比例约 13.5vp。
        正方形 viewBox 173 173 652 652 由实测墨迹框反推，勿改回「裁到外接框」——那会撑满
        24vp、比旁边的圆形刷新图标大一圈；
     3) stroke-width 22 -> 38：原画布缩到 24vp 只剩 0.53vp 细线，现约 1.4vp；
     4) 描边色跟随阅读日间文字令牌 reader_text_day（#333333）。夜间版见 reader_switch_source_night.svg。 -->
