[package]
name = "legado-engine"
version = "0.1.0"
edition = "2024"
description = "Legado book-source rule engine — pure Rust core (no NAPI)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "cookies",
] }
chardetng = "0.1"
encoding_rs = "0.8"
url = "2"
futures = "0.3"
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }