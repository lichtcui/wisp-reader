[package]
name = "legado_core"
version = "0.2.0"
edition = "2024"
description = "HarmonyOS NAPI wrapper over the legado-engine rule engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
legado-engine = { path = "../legado-engine" }
napi-ohos = { version = "1.2", default-features = false, features = ["napi8", "async"] }
napi-derive-ohos = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build-ohos = "1.2"

[profile.release]
lto = true
opt-level = "z"
strip = true